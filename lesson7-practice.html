<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lesson 7 – Decimal Number Line Sort Practice</title>

<style>
    body {
        font-family: "Comic Sans MS", Arial, sans-serif;
        background: linear-gradient(to bottom right, #ffe6f2, #fff0fa, #ffe6ff);
        margin: 0;
        padding: 20px;
        color: #4b3558;
    }

    .container {
        background: white;
        padding: 25px;
        border-radius: 20px;
        max-width: 900px;
        margin: auto;
        box-shadow: 0 8px 20px rgba(179, 157, 219, 0.5);
    }

    h2 {
        text-align: center;
        color: #8e5cff;
        margin-top: 0;
    }

    .prompt-box {
        background: #f0e6ff;
        padding: 15px;
        border-radius: 12px;
        text-align: center;
        font-size: 18px;
        margin-bottom: 25px;
    }

    .drag-area {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 30px;
        justify-content: center;
    }

    .block {
        background: #d1b3ff;
        padding: 10px 15px;
        border-radius: 10px;
        cursor: grab;
        font-size: 18px;
        box-shadow: 0 4px 10px rgba(179, 157, 219, 0.5);
    }

    .slot-row {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 10px;
        flex-wrap: wrap;
    }

    .slot-wrap {
        text-align: center;
    }

    .slot-label {
        font-size: 12px;
        color: #7b5a8c;
        margin-bottom: 4px;
    }

    .drop-slot {
        background: #fff7d6;
        width: 90px;
        height: 55px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        border: 2px dashed #d1b3ff;
    }

    .btn {
        background: #8e5cff;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 16px;
        box-shadow: 0 3px 8px rgba(179, 157, 219, 0.5);
        margin-right: 10px;
    }

    .btn:hover {
        background: #7440e0;
    }

    #result {
        margin-top: 20px;
        font-size: 20px;
        text-align: center;
    }
</style>
</head>

<body>

<div class="container">
    <h2>Decimal Number Line Sort 🔢</h2>

    <div class="prompt-box" id="promptBox">Loading decimals...</div>

    <h3 style="color:#7b5a8c; text-align:center;">Drag each decimal into the correct slot, from LEAST to GREATEST:</h3>

    <div class="drag-area" id="dragArea"></div>

    <div class="slot-row" id="slotRow"></div>

    <div style="text-align:center;">
        <button class="btn" onclick="checkAnswer()">Check Answer</button>
        <button class="btn" onclick="generateProblem()">New Decimals</button>
    </div>

    <div id="result"></div>

    <div style="text-align:center; margin-top:20px;">
        <a href="index.html" style="color:#8e5cff;">⬅ Back to Dashboard</a>
    </div>
</div>

<script>
    let decimals = [];
    let sortedDecimals = [];

    const decimalBank = [
        [0.6, 0.15, 0.45, 0.3],
        [0.52, 0.25, 0.5, 0.05],
        [0.7, 0.68, 0.8, 0.09],
        [0.4, 0.04, 0.44, 0.14],
        [0.9, 0.19, 0.09, 0.91]
    ];

    function generateProblem() {
        decimals = decimalBank[Math.floor(Math.random() * decimalBank.length)];
        sortedDecimals = [...decimals].sort((a, b) => a - b);

        document.getElementById("promptBox").textContent =
            "Sort these decimals: " + decimals.join(", ");
        document.getElementById("result").textContent = "";

        buildBlocksAndSlots();
    }

    function buildBlocksAndSlots() {
        const dragArea = document.getElementById("dragArea");
        const slotRow = document.getElementById("slotRow");
        dragArea.innerHTML = "";
        slotRow.innerHTML = "";

        const shuffled = [...decimals].sort(() => Math.random() - 0.5);

        shuffled.forEach(value => {
            const block = document.createElement("div");
            block.className = "block";
            block.textContent = value;
            block.draggable = true;
            block.addEventListener("dragstart", e => {
                e.dataTransfer.setData("text/plain", value);
            });
            dragArea.appendChild(block);
        });

        const labels = ["Least", "", "", "Greatest"];
        for (let i = 0; i < decimals.length; i++) {
            const wrap = document.createElement("div");
            wrap.className = "slot-wrap";

            const label = document.createElement("div");
            label.className = "slot-label";
            label.textContent = labels[i] || "";
            wrap.appendChild(label);

            const slot = document.createElement("div");
            slot.className = "drop-slot";
            slot.setAttribute("data-position", i);
            slot.setAttribute("data-expected", sortedDecimals[i]);

            slot.addEventListener("dragover", e => e.preventDefault());
            slot.addEventListener("drop", e => {
                const value = e.dataTransfer.getData("text/plain");
                slot.textContent = value;
                slot.style.background = "#f0e6ff";
            });

            wrap.appendChild(slot);
            slotRow.appendChild(wrap);
        }
    }

    function checkAnswer() {
        let correct = true;

        document.querySelectorAll(".drop-slot").forEach(slot => {
            const expected = slot.getAttribute("data-expected");
            const actual = slot.textContent;
            if (String(expected) !== String(actual)) correct = false;
        });

        const result = document.getElementById("result");
        if (correct) {
            result.textContent = "🎉 Correct! You sorted them from least to greatest!";
            result.style.color = "#4CAF50";
        } else {
            result.textContent = "Not quite yet — check the order and try again.";
            result.style.color = "#ff4d4d";
        }
    }

    generateProblem();
</script>

</body>
</html>
