<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lesson 1 – Factor Pairs Practice</title>

<style>
    body {
        font-family: "Comic Sans MS", Arial, sans-serif;
        background: linear-gradient(to bottom right, #ffe6f2, #fff0fa, #ffe6ff);
        margin: 0;
        padding: 20px;
        color: #4b3558;
    }

    .container {
        background: white;
        padding: 25px;
        border-radius: 20px;
        max-width: 900px;
        margin: auto;
        box-shadow: 0 8px 20px rgba(255, 122, 196, 0.4);
    }

    h2 {
        text-align: center;
        color: #ff5cad;
        margin-top: 0;
    }

    .number-box {
        background: #ffe6f7;
        padding: 15px;
        border-radius: 12px;
        text-align: center;
        font-size: 28px;
        margin-bottom: 20px;
    }

    .drag-area, .drop-area {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 20px;
        justify-content: center;
    }

    .block {
        background: #ffb3e6;
        padding: 10px 15px;
        border-radius: 10px;
        cursor: grab;
        font-size: 20px;
        box-shadow: 0 4px 10px rgba(255, 122, 196, 0.4);
    }

    .drop-slot {
        background: #fff7d6;
        width: 150px;
        height: 60px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        border: 2px dashed #ff9ecb;
        text-align: center;
        padding: 5px;
    }

    .btn {
        background: #ff7ac4;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 16px;
        box-shadow: 0 3px 8px rgba(255, 122, 196, 0.4);
        margin-right: 10px;
    }

    .btn:hover {
        background: #ff5cad;
    }

    #result {
        margin-top: 20px;
        font-size: 20px;
        text-align: center;
        color: #4b3558;
    }
</style>
</head>

<body>

<div class="container">
    <h2>Factor Pair Match-Up 🧮</h2>

    <div class="number-box" id="targetNumber">Loading number...</div>

    <h3 style="color:#7b5a8c; text-align:center;">Drag each number into a slot to build its correct factor pair partner:</h3>

    <div class="drag-area" id="dragArea"></div>

    <div class="drop-area" id="dropArea"></div>

    <button class="btn" onclick="checkAnswer()">Check Answer</button>
    <button class="btn" onclick="resetGame()">New Number</button>

    <div id="result"></div>

    <div style="text-align:center; margin-top:20px;">
        <a href="index.html" style="color:#ff5cad;">⬅ Back to Dashboard</a>
    </div>
</div>

<script>
    let number;
    let pairs = [];

    // Small set of kid-friendly numbers with nice factor pairs
    const numberBank = [12, 18, 20, 24, 30, 36];

    function getFactorPairs(n) {
        const found = [];
        for (let i = 1; i <= n; i++) {
            if (n % i === 0) {
                found.push([i, n / i]);
            }
        }
        // Skip 1×n and n×1 (too easy / duplicate), keep the rest, cap at 3 slots
        return found.filter(p => p[0] !== 1 && p[0] <= p[1]).slice(0, 3);
    }

    function generateNumber() {
        number = numberBank[Math.floor(Math.random() * numberBank.length)];
        pairs = getFactorPairs(number);

        document.getElementById("targetNumber").textContent = "Factors of " + number;
        createBlocksAndSlots();
    }

    function createBlocksAndSlots() {
        const dragArea = document.getElementById("dragArea");
        const dropArea = document.getElementById("dropArea");
        dragArea.innerHTML = "";
        dropArea.innerHTML = "";

        // Blocks: the "partner" numbers, shuffled
        const partners = pairs.map(p => p[1]);
        const shuffled = [...partners].sort(() => Math.random() - 0.5);

        shuffled.forEach(value => {
            const block = document.createElement("div");
            block.className = "block";
            block.textContent = value;
            block.draggable = true;
            block.addEventListener("dragstart", e => {
                e.dataTransfer.setData("text/plain", value);
            });
            dragArea.appendChild(block);
        });

        // Slots: the "first" number of each pair, expecting the partner
        pairs.forEach((pair, i) => {
            const slot = document.createElement("div");
            slot.className = "drop-slot";
            slot.setAttribute("data-expected", pair[1]);
            slot.textContent = pair[0] + " × ___";
            dropArea.appendChild(slot);

            slot.addEventListener("dragover", e => e.preventDefault());
            slot.addEventListener("drop", e => {
                const value = e.dataTransfer.getData("text/plain");
                slot.textContent = pair[0] + " × " + value;
                slot.style.background = "#d6ffe6";
            });
        });
    }

    function checkAnswer() {
        let correct = true;
        document.querySelectorAll(".drop-slot").forEach(slot => {
            const expected = slot.getAttribute("data-expected");
            const text = slot.textContent;
            const actual = text.split("×")[1] ? text.split("×")[1].trim() : "";
            if (actual !== expected) correct = false;
        });

        const result = document.getElementById("result");
        if (correct) {
            result.textContent = "🎉 Correct! Every pair multiplies to " + number + "!";
            result.style.color = "#4CAF50";
        } else {
            result.textContent = "Try again — one or more pairs don't multiply to " + number + " yet.";
            result.style.color = "#ff4d4d";
        }
    }

    function resetGame() {
        document.getElementById("result").textContent = "";
        generateNumber();
    }

    generateNumber();
</script>

</body>
</html>
