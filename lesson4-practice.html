<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lesson 4 – Fraction Number Line Practice</title>

<style>
    body {
        font-family: "Comic Sans MS", Arial, sans-serif;
        background: linear-gradient(to bottom right, #ffe6f2, #fff0fa, #ffe6ff);
        margin: 0;
        padding: 20px;
        color: #4b3558;
    }

    .container {
        background: white;
        padding: 25px;
        border-radius: 20px;
        max-width: 900px;
        margin: auto;
        box-shadow: 0 8px 20px rgba(255, 122, 196, 0.4);
    }

    h2 {
        text-align: center;
        color: #ff5cad;
        margin-top: 0;
    }

    .prompt-box {
        background: #fff7d6;
        padding: 15px;
        border-radius: 12px;
        text-align: center;
        font-size: 20px;
        margin-bottom: 25px;
    }

    .number-line {
        position: relative;
        height: 60px;
        margin: 40px 20px 60px 20px;
        border-top: 4px solid #ff5cad;
    }

    .tick {
        position: absolute;
        top: -6px;
        width: 2px;
        height: 14px;
        background: #ff5cad;
    }

    .tick-label {
        position: absolute;
        top: 12px;
        font-size: 13px;
        transform: translateX(-50%);
        color: #7b5a8c;
    }

    .drop-target {
        position: absolute;
        top: -20px;
        width: 40px;
        height: 40px;
        margin-left: -20px;
        border-radius: 50%;
        border: 2px dashed #ffb3e6;
        background: rgba(255, 230, 247, 0.6);
    }

    .drag-area {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 20px;
        justify-content: center;
    }

    .block {
        background: #ffb3e6;
        padding: 10px 15px;
        border-radius: 10px;
        cursor: grab;
        font-size: 18px;
        box-shadow: 0 4px 10px rgba(255, 122, 196, 0.4);
    }

    .marker {
        position: absolute;
        top: -20px;
        width: 36px;
        height: 36px;
        margin-left: -18px;
        border-radius: 50%;
        background: #ff5cad;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: bold;
    }

    .btn {
        background: #ff7ac4;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 16px;
        box-shadow: 0 3px 8px rgba(255, 122, 196, 0.4);
        margin-right: 10px;
    }

    .btn:hover {
        background: #ff5cad;
    }

    #result {
        margin-top: 20px;
        font-size: 20px;
        text-align: center;
    }
</style>
</head>

<body>

<div class="container">
    <h2>Fractions on a Number Line 📏</h2>

    <div class="prompt-box" id="promptBox">Loading fraction...</div>

    <div class="drag-area" id="dragArea"></div>

    <div class="number-line" id="numberLine"></div>

    <div style="text-align:center;">
        <button class="btn" onclick="checkAnswer()">Check Answer</button>
        <button class="btn" onclick="generateProblem()">New Fraction</button>
    </div>

    <div id="result"></div>

    <div style="text-align:center; margin-top:20px;">
        <a href="index.html" style="color:#ff5cad;">⬅ Back to Dashboard</a>
    </div>
</div>

<script>
    let denominator, numerator, placedAt = null;

    const problemBank = [
        { num: 1, den: 4 },
        { num: 3, den: 4 },
        { num: 1, den: 2 },
        { num: 2, den: 3 },
        { num: 1, den: 3 },
        { num: 5, den: 6 }
    ];

    function generateProblem() {
        const p = problemBank[Math.floor(Math.random() * problemBank.length)];
        numerator = p.num;
        denominator = p.den;
        placedAt = null;

        document.getElementById("promptBox").textContent =
            `Drag the marker to show ${numerator}/${denominator} on the number line from 0 to 1.`;
        document.getElementById("result").textContent = "";

        buildNumberLine();
        buildDragBlock();
    }

    function buildNumberLine() {
        const line = document.getElementById("numberLine");
        line.innerHTML = "";

        // Ticks at every 1/denominator step, plus endpoints
        for (let i = 0; i <= denominator; i++) {
            const percent = (i / denominator) * 100;

            const tick = document.createElement("div");
            tick.className = "tick";
            tick.style.left = percent + "%";
            line.appendChild(tick);

            const label = document.createElement("div");
            label.className = "tick-label";
            label.style.left = percent + "%";
            label.textContent = (i === 0) ? "0" : (i === denominator ? "1" : "");
            line.appendChild(label);

            const dropTarget = document.createElement("div");
            dropTarget.className = "drop-target";
            dropTarget.style.left = percent + "%";
            dropTarget.setAttribute("data-position", i);
            dropTarget.addEventListener("dragover", e => e.preventDefault());
            dropTarget.addEventListener("drop", e => {
                placedAt = parseInt(dropTarget.getAttribute("data-position"));
                document.querySelectorAll(".marker").forEach(m => m.remove());
                const marker = document.createElement("div");
                marker.className = "marker";
                marker.textContent = numerator + "/" + denominator;
                marker.style.left = percent + "%";
                line.appendChild(marker);
            });
            line.appendChild(dropTarget);
        }
    }

    function buildDragBlock() {
        const dragArea = document.getElementById("dragArea");
        dragArea.innerHTML = "";

        const block = document.createElement("div");
        block.className = "block";
        block.textContent = numerator + "/" + denominator;
        block.draggable = true;
        block.addEventListener("dragstart", e => {
            e.dataTransfer.setData("text/plain", "marker");
        });
        dragArea.appendChild(block);
    }

    function checkAnswer() {
        const result = document.getElementById("result");
        if (placedAt === numerator) {
            result.textContent = "🎉 Correct! " + numerator + "/" + denominator + " is exactly " + numerator + " steps from 0!";
            result.style.color = "#4CAF50";
        } else if (placedAt === null) {
            result.textContent = "Drag the marker onto the number line first!";
            result.style.color = "#ff4d4d";
        } else {
            result.textContent = "Not quite — count " + numerator + " equal steps from 0 and try again.";
            result.style.color = "#ff4d4d";
        }
    }

    generateProblem();
</script>

</body>
</html>
