<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lesson 6 – Decimal Place Value Practice</title>

<style>
    body {
        font-family: "Comic Sans MS", Arial, sans-serif;
        background: linear-gradient(to bottom right, #ffe6f2, #fff0fa, #ffe6ff);
        margin: 0;
        padding: 20px;
        color: #4b3558;
    }

    .container {
        background: white;
        padding: 25px;
        border-radius: 20px;
        max-width: 900px;
        margin: auto;
        box-shadow: 0 8px 20px rgba(159, 230, 176, 0.5);
    }

    h2 {
        text-align: center;
        color: #34a853;
        margin-top: 0;
    }

    .number-box {
        background: #e6ffea;
        padding: 15px;
        border-radius: 12px;
        text-align: center;
        font-size: 28px;
        margin-bottom: 20px;
    }

    .drag-area, .drop-area {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 20px;
        justify-content: center;
    }

    .block {
        background: #9fe6b0;
        padding: 10px 15px;
        border-radius: 10px;
        cursor: grab;
        font-size: 20px;
        box-shadow: 0 4px 10px rgba(52, 168, 83, 0.4);
    }

    .drop-slot {
        background: #fff7d6;
        width: 130px;
        height: 50px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        border: 2px dashed #9fe6b0;
        flex-direction: column;
    }

    .slot-label {
        font-size: 11px;
        color: #7b5a8c;
        margin-bottom: 2px;
    }

    .btn {
        background: #34a853;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 16px;
        box-shadow: 0 3px 8px rgba(52, 168, 83, 0.4);
        margin-right: 10px;
    }

    .btn:hover {
        background: #2c8c46;
    }

    #result {
        margin-top: 20px;
        font-size: 20px;
        text-align: center;
    }
</style>
</head>

<body>

<div class="container">
    <h2>Decimal Place Value Match 💰</h2>

    <div class="number-box" id="targetNumber">Loading number...</div>

    <h3 style="color:#7b5a8c; text-align:center;">Drag each digit into its correct place value slot:</h3>

    <div class="drag-area" id="dragArea"></div>

    <div class="drop-area" id="dropArea"></div>

    <button class="btn" onclick="checkAnswer()">Check Answer</button>
    <button class="btn" onclick="resetGame()">New Number</button>

    <div id="result"></div>

    <div style="text-align:center; margin-top:20px;">
        <a href="index.html" style="color:#34a853;">⬅ Back to Dashboard</a>
    </div>
</div>

<script>
    let ones, tenths, hundredths;

    function generateNumber() {
        ones = Math.floor(Math.random() * 8) + 1;
        tenths = Math.floor(Math.random() * 10);
        hundredths = Math.floor(Math.random() * 10);

        document.getElementById("targetNumber").textContent =
            ones + "." + tenths + hundredths;

        createBlocksAndSlots();
    }

    function createBlocksAndSlots() {
        const dragArea = document.getElementById("dragArea");
        const dropArea = document.getElementById("dropArea");
        dragArea.innerHTML = "";
        dropArea.innerHTML = "";

        const digits = [ones, tenths, hundredths];
        const shuffled = [...digits].sort(() => Math.random() - 0.5);

        shuffled.forEach(value => {
            const block = document.createElement("div");
            block.className = "block";
            block.textContent = value;
            block.draggable = true;
            block.addEventListener("dragstart", e => {
                e.dataTransfer.setData("text/plain", value);
            });
            dragArea.appendChild(block);
        });

        const places = [
            { key: "ones", label: "Ones", expected: ones },
            { key: "tenths", label: "Tenths", expected: tenths },
            { key: "hundredths", label: "Hundredths", expected: hundredths }
        ];

        places.forEach(place => {
            const slot = document.createElement("div");
            slot.className = "drop-slot";
            slot.setAttribute("data-place", place.key);
            slot.setAttribute("data-expected", place.expected);

            const label = document.createElement("div");
            label.className = "slot-label";
            label.textContent = place.label;
            slot.appendChild(label);

            const valueSpan = document.createElement("span");
            valueSpan.className = "value-span";
            slot.appendChild(valueSpan);

            slot.addEventListener("dragover", e => e.preventDefault());
            slot.addEventListener("drop", e => {
                const value = e.dataTransfer.getData("text/plain");
                valueSpan.textContent = value;
                slot.style.background = "#d6ffe6";
            });

            dropArea.appendChild(slot);
        });
    }

    function checkAnswer() {
        let correct = true;

        document.querySelectorAll(".drop-slot").forEach(slot => {
            const expected = slot.getAttribute("data-expected");
            const valueSpan = slot.querySelector(".value-span");
            const actual = valueSpan.textContent;

            if (String(expected) !== String(actual)) correct = false;
        });

        const result = document.getElementById("result");
        if (correct) {
            result.textContent = "🎉 Correct! Every digit is in the right place!";
            result.style.color = "#4CAF50";
        } else {
            result.textContent = "Try again — one or more digits are in the wrong place value.";
            result.style.color = "#ff4d4d";
        }
    }

    function resetGame() {
        document.getElementById("result").textContent = "";
        generateNumber();
    }

    generateNumber();
</script>

</body>
</html>
